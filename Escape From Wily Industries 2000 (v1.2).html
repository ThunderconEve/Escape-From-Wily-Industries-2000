C.rel="icon",C.href=n.toDataURL("image/png"),document.head.appendChild(C),URL.revokeObjectURL(e.src)},e.onerror=()=>console.error("Could not load the logo SVG for the favicon."),e.src=URL.createObjectURL(new Blob([C],{type:"image/svg+xml"}))}updateFavicon(),colorScheme.addEventListener("change",updateFavicon)</script><section id="menu"><h2>Escape from Wily Industries 2000</h2><button id="startGame">Start Game</button><div id="wily-logo"><svg viewBox="0 0 464 256" role="img" aria-label="Wily Industries 2000 logo"><path id="wily-mark" fill="#10243a"/></svg><li class="layer" id="specks"></li></div></section><h1>Escape from Wily Industries 2000</h1><div id="status"></div><main id="story"></main><script>"use strict";const PLACES={office:["Office",""],desk:["Under the Desk","Heavy steps cross the floor. Metal on tile. Slow, deliberate.||You've seen an enforcer only a few times, always at a distance, always after the shouting had already started. You know what will happen if it reaches you.||Don't move.||Don't breathe.||The desk creaks above you, its joints strained."],breakroom:["Break Room","Depressing halogen lights glow above a row of largely emptied and abandoned staff lockers, their luminous haze making the room feel even more desolate. A coffee machine hums dutifully on the counter. One remaining locker has a worn combination lock."],elevator:["Service Elevator","The service elevator waits with its security reader glowing red. The sealed doors reflect the warning light."],hallway:["Ground-Floor Hallway","Enforcers patrol the lobby beyond the hallway. A vending machine is within reach; the carpark is just past the wall, a narrow stretch of shadow potentially concealing your escape."],carpark:["Carpark","A separate, locked basement entrance is set into the carpark wall, its metal frame rusting at the edges. It has a badge reader."],basement:["Basement Corridor","A quiet corridor runs beneath the building. Four unnumbered doors have badge readers."],bas1:["Recharging Room","Rows of enforcers stand in recharging stations, their expressionless faces fixed toward the room. One wears headphones, and a nametag reading 'KILROY'."],bas2:["Surveillance Room","A program labeled “Known Thomas Light Locations” fills a screen beside a digital map. A pinprick of red glows faintly on the right side of the gridded map on the screen.||A desk holds a photograph of two university students and a bottle of Front Man whiskey."],bas3:["Rocket Bay","A rocket-launching bay stretches beneath Wily Industries. Guidance equipment is powered up, emitting a thin, steady whine."],bas4:["Project Forte","The door opens onto Project Forte, a robotic guard dog with a sleek steel frame.."],car:["Company Car","You slip into the company car. The radio crackles when the engine is running."],junction1:["The First Junction","..."],junction2:["The Second Junction","..."],junction3:["The Third Junction","..."],junction4:["The Fourth Junction","..."],deadendConcert:["Deadend One - Concert Hall","You pass a concert hall, the neon blue and magenta lights washing over you. Ellen Aim and the Attackers are preparing to play. Rebels mistake you for a Wily Industries employee."],deadendDrone:["Deadend Two - Drone Patrol","Drones sweep the street, their spotlights probing every parked car, slowly and deliberately."],deadendGas:["Deadend Four - Gas Station","A gas station glows beside the road. A clerk watches the telescreen, its garish light reflected in the glass. The pump clicks in the silence."],deadendRooftop:["Deadend Five - Rooftop","A spotlight catches a man in a balaclava on a rooftop. A helicopter hovers above him, its spotlight streaming through the haze as he inches along the ledge."],deadendMine:["Deadend Six - Mine","The old Stanton mines... the road forks outside beside a dark metal entrance, its edges shaded by the barren rise. You hear a whistle in the breeze."],deadendTrain:["Deadend Seven - Trainyard","The trainyard swarms with enforcers, metal clapping against stone in the dark. An old tenement stands beside the tracks."],deadendGraffiti:["Deadend Eight - Graffiti Alley","A graffiti-covered wall reads: “WHERE ARE THEY?” The alley narrows toward the entrance to your apartment. There is a door to a utilities box with a sign that reads DANGER - LIVE ELECTRICITY."],tenement:["Light's Old Tenement","A ghostly figure greets you."],hideout:["Hideout","A reinforced door stands along the end of a narrow lane at the edge of the city.||You are drawn to knock and idly note 'Welcome to The Thundercon' graffitied on the wall.||Someone watches through a slit, their face obscured by shadow."],corridor:["Executive Corridor","A guard patrols between the elevator and Wily's office, lacking the automated precision of the metal enforcers."],wily:["Wily's Office",""],deadendGraveyard:["Deadend - Graveyard","You exit the car and find yourself at a beggar's cemetery. Stepping through the iron gates you walk through rows of simple stone markers. Somewhere among the stones, something makes a curious mechanical noise."],over:["Game Over",""],lastStory:["The Last Story","You sit in a purgatory state, motionless, as memories of all your previous nights flood back. Iterations of the same streets, the same fear, moments of bloodshed and regret.||You are aware of the presence of Emily Stanton.||She explains why you keep reliving the same night over and over. You have been bifurcated through tangent universes. You are now a living receiver of fate, guided by herself as a member of the human choir of manipulated dead. Your role is to bring deliverance.||There is a master copy of a banned film in Thomas Light's tenement. You are tasked with carrying the tapes back through the wormhole to 1984 and deliver it to Sound Machine Records. From there, they will commission a local band to recreate its soundtrack, inspiring a young insurgent named Joe Wilson into acting against Wily.||You find yourself awake in the office. You run through the familiar steps of getting out and into the car. You make a beeline for Light's tenement and grab the master tape, and follow fate's guiding hand.||This time, when the kugelblitz collapses, you'll be ready. You drive to the edge of town.||The clouds gather in a dark vortex and you find yourself swallowed up by a piercing blue beam of light that splits the night. When you awaken, it's 28 years ago. You take the tape to Sound Machine Records and narrate your story to an amused producer.||Whether they believed you or not, someone recognised the worth of what you were offering and greedily accepted the master reels. || You live out the rest of your days as an employee of Sound Machine Records. You keep tabs on the fate of Thomas Light, and the sons of fate, and produce records with the Protomen to ensure that the story is told.||Your codename is The Narrator.||||Thanks for playing.||Goodnight."]},ENDINGS={dueVendetta:"Due Vendetta",goodDoctor:"The Good Doctor",theFall:"The Fall",breakingOut:"Breaking Out",fatherOfDeath:"Father of Death",splitTheNight:"Split the Night",salvation:"We Are Your Salvation",surveillanceTrain:"What Are You Doing Here?",whiskeyInCar:"The More You Know"},JUNCTIONS={junction1:{exits:{north:["junction2","north"],east:["deadendRooftop","east"],south:["car","south"],west:["deadendDrone","west"]},mainRouteSide:"north",description:"The road leaves Wily Industries and divides at the first four-way junction. Office lights glow to the south, and residential and corporate buildings line the road north. A searchlight sweeps the west side. To the east, a helicopter hovers near a skyscraper."},junction2:{exits:{north:["deadendConcert","north"],east:["junction3","east"],south:["junction1","south"],west:["deadendGraffiti","west"]},mainRouteSide:"east",description:"The buildings are thinning, and the city’s glow is fainter here. The road west runs toward a neglected stretch of town and a graffiti-marked wall."},junction3:{exits:{north:["junction4","north"],east:["deadendTrain","east"],south:["deadendGraveyard","south"],west:["junction2","west"]},mainRouteSide:"north",description:"The city gives way to industrial outskirts. The trainyard lies to the east, and a lonely graveyard sits along the road south. To the west, the road leads back toward the city; north, the buildings grow sparse."},junction4:{exits:{north:["deadendMine","north"],east:["hideout","east"],south:["junction3","south"],west:["deadendGas","west"]},mainRouteSide:"east",description:"The final junction lies beyond the trainyard, at the city’s edge. Scattered buildings give way to scrubland and open wasteland. A dark, barren rise lies to the north; a lonely gas station glows to the west, while the road east leads toward a concealed entrance."}},PRESSURE={office:{messages:{0:"",2:"You hear what sounds like footsteps in the distance.",3:"Everything seems perfectly still. The hush is unsettling.",4:"It’s definitely footsteps. They’re coming closer.",5:"A shadow slips past the window.",6:"Your feet begin to quake."},timeout:7,gameOver:()=>game.noticeRead?"The enforcer finds you in the office and drives its blade into you.":"The enforcer puts a hand on your shoulder and turns you around into the knife it is holding. You die without even knowing why."},desk:{messages:{1:"The floorboards creak nearby. You cower beneath the desk, barely breathing.",2:"The footsteps stop nearby. Metal creaks above you."},timeout:3,gameOver:()=>"The enforcer finds you beneath the desk and drags you out."},breakroom:{messages:{3:"Footsteps approach along the hallway outside.",4:"The footsteps stop just beyond the break-room door.",5:"A distant siren wails from the floor below."},timeout:6,gameOver:()=>"player"===game.items.badge.place||"bag"===game.items.badge.place?"An enforcer storms into the break room and catches you before you can escape.":"An enforcer storms into the break room. The employee badge is still out of reach, and you have nowhere to hide."},elevator:{messages:{2:"The elevator shudders. Somewher
